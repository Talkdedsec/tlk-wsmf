[package]
name = "tlk-wsmf"
version = "0.1.0"
edition = "2024"
description = "Finds out which application steals your keyboard focus on Windows, and stops it"
repository = "https://github.com/Talkdedsec/tlk-wsmf"
license = "MIT"
readme = "README.md"

[[bin]]
name = "wsmf"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_Security"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
