[package]
name = "tlk-wsmf"
version = "0.1.1"
edition = "2024"
description = "Finds out which application steals your keyboard focus on Windows, and stops it"
repository = "https://github.com/Talkdedsec/tlk-wsmf"
license = "MIT"
readme = "README.md"
keywords = ["windows", "focus", "tray", "productivity"]
categories = ["gui", "os::windows-apis"]
rust-version = "1.85"

[lib]
name = "tlk_wsmf"
path = "src/lib.rs"

[[bin]]
name = "wsmf"
path = "src/main.rs"

# Lint level lives here rather than in CI flags, so a local build and the workflow
# fail on exactly the same things.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "allow"
uninlined_format_args = "warn"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
egui = { version = "0.36.1", default-features = false }
egui_extras = { version = "0.36.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.5"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_Security", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_ProcessStatus", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_Security", "Win32_Globalization", "Win32_Graphics_Dwm"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
