name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      # Release, because the performance budget is measured against a real build
      # and the window tests want the actual executable.
      - name: Unit, window and budget tests
        run: cargo test --release

      - uses: actions/upload-artifact@v7
        with:
          name: wsmf
          path: target/release/wsmf.exe

  # The version in Cargo.toml has to match the tag, or the release lies about itself.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag $tag, crate $crate"
          test "$tag" = "$crate"

  audit:
    permissions:
      contents: read
      checks: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, version]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release

      - name: Checksum
        run: |
          cd target/release
          (Get-FileHash wsmf.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii wsmf.exe.sha256
          Get-Content wsmf.exe.sha256

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          files: |
            target/release/wsmf.exe
            target/release/wsmf.exe.sha256
          generate_release_notes: true
          body_path: .github/release-body.md
