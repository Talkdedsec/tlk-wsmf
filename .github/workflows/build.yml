name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      # Release, because the performance budget is measured against a real build
      # and the window tests want the actual executable.
      - name: Unit, window and budget tests
        run: cargo test --release

      - uses: actions/upload-artifact@v7
        with:
          name: wsmf
          path: target/release/wsmf.exe

  # The version in Cargo.toml has to match the tag, or the release lies about itself.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag $tag, crate $crate"
          test "$tag" = "$crate"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, version]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Checksum
        run: |
          cd target/release
          (Get-FileHash wsmf.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii wsmf.exe.sha256
          Get-Content wsmf.exe.sha256

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            target/release/wsmf.exe
            target/release/wsmf.exe.sha256
          generate_release_notes: true
          body: |
            Download `wsmf.exe` and run it. One file, no installer.

            This build is not code signed yet, so SmartScreen will warn on first run.
            The executable is built by this repository's workflow from the tag it
            claims; the SHA-256 is in `wsmf.exe.sha256` beside it, and the workflow
            run that produced both is linked above.
